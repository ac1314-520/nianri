org.gradle.jvmargs=-Xmx3072m
# Windows + non-ASCII workspace paths: keep Kotlin in the Gradle JVM and
# avoid its argument file escaping bug.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.native=false
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace path contains Chinese characters. AGP's path check is only a
# warning about a legacy Windows limitation and is safe to bypass here.
android.overridePathCheck=true
kotlin.code.style=official
